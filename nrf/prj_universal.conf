# Joypad universal — nRF52840 Kconfig overrides
#
# Applied on top of prj.conf when building APP_TYPE=universal.
# BLE peripheral mode (HOGP gamepad) + sensor input.
# BTstack handles BLE host stack via raw HCI — Zephyr provides the controller.

# Enable peripheral role in the SoftDevice Controller
# (prj.conf already has CONFIG_BT_CENTRAL=y and CONFIG_BT_OBSERVER=y for central;
#  peripheral mode additionally needs CONFIG_BT_PERIPHERAL for advertising support)
CONFIG_BT_PERIPHERAL=y

# Onboard IMU — XIAO nRF52840 Sense LSM6DS3TR-C at 0x6a/0x6b on i2c0. Read via a
# direct I2C register driver (nrf/src/imu_nrf.c); it also drives the P1.08 power
# pin high itself (the regulator-fixed node doesn't reliably hold it).
CONFIG_I2C=y



# Zephyr open-source link layer (see boards/makerdiary_nrf52840.overlay).
CONFIG_BT_LL_SW_SPLIT=y

# Maximum radio transmit power (nRF52840 tops out at +8 dBm; Zephyr defaults to 0).
# Measured with a sniffer: this dongle advertised ~25 dB weaker than every other
# device in the room while sitting inches from the receiver, and a console that
# barely hears a controller has no reason to connect to it.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Link-layer data length. A real Pro Controller 2 negotiates DLE 251, and the
# console negotiates a 247-byte ATT MTU against us -- which over 27-byte PDUs
# (Zephyr's default) means every command it sends has to be fragmented. The
# console exchanges the MTU and then stops talking, so match the pad.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
