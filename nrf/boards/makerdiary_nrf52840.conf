# Makerdiary nRF52840 MDK USB Dongle board-specific config
#
# Ships a UF2 bootloader (no SoftDevice; code at 0x1000): stock Makerdiary
# uf2boot (UF2BOOT drive) or the Adafruit nRF52 no-SD build (MDK-DONGLE drive).
# Zephyr's default DTS for nrf52840_mdk_usb_dongle uses MCUboot partitions —
# the overlay replaces them with the UF2 layout.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_BOARD_HAS_NRF5_BOOTLOADER=n
